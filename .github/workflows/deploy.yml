name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check required files
        run: for f in index.html Mohamed_Younes_CV_EN.pdf og-image.png robots.txt sitemap.xml; do test -f "$f" || { echo "Missing $f"; exit 1; }; done
      - name: Package site
        run: |
          mkdir _site
          cp index.html Mohamed_Younes_CV_EN.pdf og-image.png robots.txt sitemap.xml _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4